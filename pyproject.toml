[project]
name = "sublinear-sft"
version = "0.0.1"
description = "Python implementation of Sublinear Sparse Fourier Transform algorithm"
readme = "README.md"
authors = [
    { name = "Craig Grosch", email = "grosscra@msu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "sympy>=1.14.0",
]

[project.scripts]
sublinear-sft = "sublinear_sft:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
testpaths = [
	"tests",
]

[dependency-groups]
dev = [
    "mkdocstrings[python]>=1.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.83",
    "zensical>=0.0.53",
]
